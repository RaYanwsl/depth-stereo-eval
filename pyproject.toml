[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-stereo-eval"
version = "0.1.0"
description = "统一协议下的单目深度估计与立体匹配评测"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "RaYanwsl" }]
dependencies = ["numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
depth-eval = "depth_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
